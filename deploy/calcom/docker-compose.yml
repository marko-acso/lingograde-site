version: "3.8"

services:
  calcom-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calcom
    volumes:
      - calcom-db-data:/var/lib/postgresql/data
    networks:
      - calcom-net

  calcom:
    image: calcom/cal.com:latest
    restart: always
    depends_on:
      - calcom-db
    environment:
      DATABASE_URL: postgresql://calcom:${POSTGRES_PASSWORD}@calcom-db:5432/calcom
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://booking.lingograde.com
      NEXT_PUBLIC_WEBAPP_URL: https://booking.lingograde.com
      NEXT_PUBLIC_API_V2_URL: https://booking.lingograde.com/api/v2
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      # Stripe
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${NEXT_PUBLIC_STRIPE_PUBLIC_KEY}
      PAYMENT_FEE_PERCENTAGE: 0
      PAYMENT_FEE_FIXED: 0
      # Email (Resend)
      EMAIL_FROM: noreply@lingograde.com
      EMAIL_SERVER_HOST: smtp.resend.com
      EMAIL_SERVER_PORT: 465
      EMAIL_SERVER_USER: resend
      EMAIL_SERVER_PASSWORD: ${RESEND_API_KEY}
      # Back-link to main site
      NEXT_PUBLIC_WEBSITE_URL: https://www.lingograde.com
      # Misc
      NODE_ENV: production
      CALCOM_TELEMETRY_DISABLED: 1
    ports:
      - "3001:3000"
    networks:
      - calcom-net

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - calcom-net

volumes:
  calcom-db-data:
  caddy-data:
  caddy-config:

networks:
  calcom-net:
